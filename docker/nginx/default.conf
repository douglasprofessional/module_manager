# Nginx — proxy reverso da Plataforma (ambiente local com Docker Compose).
# Serve /static/ e /media/ diretamente (rápido) e encaminha o restante ao
# Gunicorn (serviço 'web'). Em produção no EasyPanel, o proxy é o da própria
# plataforma; este arquivo vale para o Compose local (e como referência de VPS).

upstream app {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Tamanho máximo de upload (fotos/logo até 2 MB; folga para outros envios).
    client_max_body_size 25m;

    # Compressão de respostas de texto.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Arquivos estáticos coletados (WhiteNoise também os serviria, mas o Nginx
    # é mais rápido e alivia o app). Volume compartilhado com o serviço web.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploads (logo do sistema, fotos de perfil, imagens de posts).
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "private";
        # Uploads nunca executam scripts (protege contra SVG malicioso / XSS).
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Aplicação Django (Gunicorn).
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
